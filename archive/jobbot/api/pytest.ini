"""
Configuration for pytest.
"""

import os
import sys

# Add the jobbot directory to the path
sys.path.insert(0, os.path.join(os.path.dirname(__file__), '../..'))

# Environment variables for testing
os.environ.setdefault("JWT_SECRET_KEY", "test-secret-key-min-32-chars-long-for-testing")
os.environ.setdefault("APP_ENV", "testing")
os.environ.setdefault("TELEGRAM_BOT_TOKEN", "test_bot_token")
os.environ.setdefault("STRIPE_WEBHOOK_SECRET", "whsec_test_secret_key_for_testing_webhooks")
os.environ.setdefault("MP_WEBHOOK_SECRET", "mp_test_webhook_secret")
os.environ.setdefault("STRIPE_SECRET_KEY", "sk_test_secret_key")
os.environ.setdefault("MP_ACCESS_TOKEN", "test_access_token")


def pytest_configure(config):
    """Configure pytest."""
    # Add custom markers
    config.addinivalue_line("markers", "slow: marks tests as slow (deselect with '-m \"not slow\"')")
    config.addinivalue_line("markers", "integration: marks tests as integration tests")
    config.addinivalue_line("markers", "security: marks tests as security tests")
    config.addinivalue_line("markers", "webhook: marks tests as webhook tests")
    config.addinivalue_line("markers", "payment: marks tests as payment tests")
    config.addinivalue_line("markers", "auth: marks tests as authentication tests")


def pytest_collection_modifyitems(config, items):
    """Add markers to test items based on their name."""
    for item in items:
        if "webhook" in item.nodeid.lower():
            item.add_marker(pytest.mark.webhook)
        if "payment" in item.nodeid.lower() or "stripe" in item.nodeid.lower() or "mercadopago" in item.nodeid.lower():
            item.add_marker(pytest.mark.payment)
        if "security" in item.nodeid.lower() or "auth" in item.nodeid.lower():
            item.add_marker(pytest.mark.security)
        if "slow" in item.nodeid.lower():
            item.add_marker(pytest.mark.slow)

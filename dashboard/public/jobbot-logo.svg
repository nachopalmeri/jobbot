<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <!-- Robot Body -->
  <rect x="20" y="25" width="25" height="20" rx="3" fill="#4CAF50"/>
  
  <!-- Robot Head -->
  <rect x="22" y="15" width="21" height="12" rx="2" fill="#66BB6A"/>
  
  <!-- Antennas -->
  <line x1="28" y1="15" x2="28" y2="8" stroke="#4CAF50" stroke-width="2"/>
  <circle cx="28" cy="6" r="3" fill="#81C784"/>
  <line x1="37" y1="15" x2="37" y2="8" stroke="#4CAF50" stroke-width="2"/>
  <circle cx="37" cy="6" r="3" fill="#81C784"/>
  
  <!-- Eyes -->
  <circle cx="27" cy="20" r="2.5" fill="white"/>
  <circle cx="27" cy="20" r="1" fill="#333"/>
  <circle cx="38" cy="20" r="2.5" fill="white"/>
  <circle cx="38" cy="20" r="1" fill="#333"/>
  
  <!-- Smile -->
  <path d="M 28 23 Q 32.5 26 37 23" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Arms -->
  <path d="M 20 30 Q 15 32 15 28" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 45 30 Q 50 32 50 28" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Wheels/Legs -->
  <circle cx="25" cy="48" r="5" fill="#388E3C"/>
  <circle cx="40" cy="48" r="5" fill="#388E3C"/>
  
  <!-- Logo Text -->
  <text x="65" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    Job<tspan fill="#4CAF50">Bot</tspan>
  </text>
  
  <!-- Speech bubble with briefcase -->
  <path d="M 75 15 Q 85 5 95 15 Q 105 5 115 15 L 115 25 Q 115 30 110 30 L 95 28 L 80 30 Q 75 30 75 25 Z" fill="white" stroke="#4CAF50" stroke-width="1.5"/>
  <rect x="88" y="14" width="14" height="10" rx="1" fill="none" stroke="#666" stroke-width="1.5"/>
  <path d="M 92 14 L 92 12 Q 92 11 93 11 L 97 11 Q 98 11 98 12 L 98 14" fill="none" stroke="#666" stroke-width="1.5"/>
</svg>

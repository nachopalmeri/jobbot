services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobbot}
      POSTGRES_USER: ${POSTGRES_USER:-jobbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobbot} -d ${POSTGRES_DB:-jobbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_TYPE: ${DATABASE_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobbot:${POSTGRES_PASSWORD}@postgres:5432/jobbot}
      CV_STORAGE_PATH: ${CV_STORAGE_PATH:-/app/data/cvs}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - cv_data:/app/data/cvs
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      DATABASE_TYPE: ${DATABASE_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobbot:${POSTGRES_PASSWORD}@postgres:5432/jobbot}
      CV_STORAGE_PATH: ${CV_STORAGE_PATH:-/app/data/cvs}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cv_data:/app/data/cvs
    restart: unless-stopped

volumes:
  postgres_data:
  cv_data:

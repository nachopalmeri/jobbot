name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend Tests
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: jobbot
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: jobbot_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
      
      - name: Run tests
        env:
          DATABASE_TYPE: postgresql
          DATABASE_URL: postgresql://jobbot:testpassword@localhost:5432/jobbot_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-min-32-chars-long-for-testing
          APP_ENV: testing
        run: |
          cd api
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./api/coverage.xml
          flags: backend
          name: backend-coverage

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
      
      - name: Run Bandit (security lint)
        run: |
          bandit -r api/ -f json -o bandit-report.json || true
          bandit -r api/ -ll || true
      
      - name: Run pip-audit
        run: |
          pip-audit --requirement=api/requirements.txt || true
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: security-report
          path: bandit-report.json

  # Frontend Tests
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      
      - name: Install dependencies
        run: |
          cd dashboard
          npm ci
      
      - name: Run lint
        run: |
          cd dashboard
          npm run lint || true
      
      - name: Run tests
        run: |
          cd dashboard
          npm test || true
      
      - name: Build
        run: |
          cd dashboard
          npm run build

  # Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: jobbot
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: jobbot_test
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
      
      - name: Start API
        env:
          DATABASE_TYPE: postgresql
          DATABASE_URL: postgresql://jobbot:testpassword@localhost:5432/jobbot_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-min-32-chars-long-for-testing
          APP_ENV: testing
        run: |
          cd api
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health || exit 1
      
      - name: Run health checks
        run: |
          curl -f http://localhost:8000/health/ready || exit 1

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add staging deployment commands here
          # e.g., vercel --prod for dashboard
          # e.g., docker build/push for API

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan, integration-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add production deployment commands here
